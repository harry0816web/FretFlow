[project]
name = "fretflow"
version = "0.1.0"
description = "Music stem separation and guitar TAB platform"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "alembic>=1.16,<2",
    "basic-pitch>=0.4.0,<0.5",
    "fastapi>=0.119,<1",
    "numpy>=1.24.0,<2",
    "pretty-midi>=0.2.10,<1",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "scikit-learn>=1.0,<1.6",
    "scipy>=1.10,<1.15",
    "setuptools>=68,<81",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.37,<1",
    "yt-dlp>=2026.10.21",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
